<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="900" height="48" role="img" aria-label="Cyber Laser Divider"><title>Cyber Laser Divider</title><defs>
<linearGradient id="cyberSky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#02040a"/>
  <stop offset=".4" stop-color="#060b18"/>
  <stop offset=".8" stop-color="#0a152e"/>
  <stop offset="1" stop-color="#121026"/>
</linearGradient>

<linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00c8ff"/>
  <stop offset=".5" stop-color="#00f0ff"/>
  <stop offset="1" stop-color="#70f8ff"/>
</linearGradient>

<linearGradient id="neonMagenta" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff0055"/>
  <stop offset=".5" stop-color="#ff00a0"/>
  <stop offset="1" stop-color="#bf00ff"/>
</linearGradient>

<linearGradient id="cyberLaser" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
  <stop offset=".15" stop-color="#00f0ff" stop-opacity=".8"/>
  <stop offset=".5" stop-color="#ffffff" stop-opacity="1"/>
  <stop offset=".85" stop-color="#ff007f" stop-opacity=".8"/>
  <stop offset="1" stop-color="#ff007f" stop-opacity="0"/>
</linearGradient>

<linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
  <stop offset=".8" stop-color="#00f0ff" stop-opacity=".15"/>
  <stop offset="1" stop-color="#00f0ff" stop-opacity=".85"/>
</linearGradient>

<linearGradient id="cyberCardBg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#091224" stop-opacity=".96"/>
  <stop offset="1" stop-color="#050a16" stop-opacity=".98"/>
</linearGradient>

<pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
  <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width=".7" stroke-opacity=".08"/>
</pattern>

<pattern id="hexGrid" width="28" height="48.5" patternUnits="userSpaceOnUse">
  <path d="M14 0L28 8.08V24.25L14 32.33L0 24.25V8.08Z M0 48.5L14 40.42L28 48.5" fill="none" stroke="#00f0ff" stroke-width=".6" stroke-opacity=".06"/>
</pattern>

<filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="3.5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="glowMagenta" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="3.5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="laserBlur" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="5"/>
</filter>
</defs><rect x="60" y="23" width="780" height="2" fill="url(#cyberLaser)"/><circle cx="450" cy="24" r="16" fill="#00f0ff" opacity=".15"><animate attributeName="r" values="10;22;10" dur="2.5s" repeatCount="indefinite"/></circle><g transform="translate(450 24)"><circle cx="0" cy="0" r="14" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity=".5" stroke-dasharray="6 8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></circle><circle cx="0" cy="0" r="9.1" fill="none" stroke="#ff007f" stroke-width="1.2" stroke-opacity=".6" stroke-dasharray="14 10"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/></circle><circle cx="0" cy="0" r="3" fill="#00f0ff"><animate attributeName="opacity" values=".4;1;.4" dur="1.8s" repeatCount="indefinite"/></circle><line x1="-22" y1="0" x2="-10" y2="0" stroke="#00f0ff" stroke-width="1.5"/><line x1="10" y1="0" x2="22" y2="0" stroke="#00f0ff" stroke-width="1.5"/><line x1="0" y1="-22" x2="0" y2="-10" stroke="#00f0ff" stroke-width="1.5"/><line x1="0" y1="10" x2="0" y2="22" stroke="#00f0ff" stroke-width="1.5"/></g><polygon points="446,20 454,20 450,28" fill="#ff007f"/><rect x="200" y="21" width="6" height="6" fill="#00f0ff"/><rect x="700" y="21" width="6" height="6" fill="#ff007f"/></svg>