ontenders across India.</text></g><g transform="translate(24 80)"><rect width="852" height="52" fill="#070e1c" stroke="#142442" stroke-width="1"/><line x1="0" y1="0" x2="4" y2="52" stroke="#00f0ff" stroke-width="4"/><text x="18" y="22" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">GOOGLE AGENTIC AI DAY HACKATHON 2025</text><text x="836" y="22" fill="#7898ba" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end" letter-spacing="1">[ON-SITE FINALIST // BIEC BENGALURU]</text><text x="18" y="40" fill="#e6f6ff" font-family="monospace" font-size="11">Selected and invited on-site at BIEC Bengaluru to engineer autonomous agentic workflows & systems.</text></g><g transform="translate(24 140)"><rect width="852" height="52" fill="#070e1c" stroke="#142442" stroke-width="1"/><line x1="0" y1="0" x2="4" y2="52" stroke="#00ff9d" stroke-width="4"/><text x="18" y="22" fill="#00ff9d" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">TIC TECH TOE HACKATHONS</text><text x="836" y="22" fill="#7898ba" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end" letter-spacing="1">[CAMPUS LAURELS // DA-IICT]</text><text x="18" y="40" fill="#e6f6ff" font-family="monospace" font-size="11">Competed across multiple editions on-campus at Dhirubhai Ambani University, solving algorithmic & systems challenges.</text></g><g transform="translate(24 200)"><rect width="852" height="52" fill="#070e1c" stroke="#142442" stroke-width="1"/><line x1="0" y1="0" x2="4" y2="52" stroke="#ff007f" stroke-width="4"/><text x="18" y="22" fill="#ff007f" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">COMPETITIVE PROGRAMMING CADRE</text><text x="836" y="22" fill="#7898ba" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end" letter-spacing="1">[ACTIVE OPERATIVE // CODEFORCES & LEETCODE]</text><text x="18" y="40" fill="#e6f6ff" font-family="monospace" font-size="11">Regular solver on Codeforces (King-T), LeetCode (King-T_7361), CodeChef (tanishq7361), and Codolio.</text></g></svg>