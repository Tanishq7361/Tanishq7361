<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Farewell, Cyber Operative"><title>Farewell, Cyber Operative</title><defs>
<linearGradient id="cyberSky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#02040a"/>
  <stop offset=".4" stop-color="#060b18"/>
  <stop offset=".8" stop-color="#0a152e"/>
  <stop offset="1" stop-color="#121026"/>
</linearGradient>

<linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00c8ff"/>
  <stop offset=".5" stop-color="#00f0ff"/>
  <stop offset="1" stop-color="#70f8ff"/>
</linearGradient>

<linearGradient id="neonMagenta" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff0055"/>
  <stop offset=".5" stop-color="#ff00a0"/>
  <stop offset="1" stop-color="#bf00ff"/>
</linearGradient>

<linearGradient id="cyberLaser" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
  <stop offset=".15" stop-color="#00f0ff" stop-opacity=".8"/>
  <stop offset=".5" stop-color="#ffffff" stop-opacity="1"/>
  <stop offset=".85" stop-color="#ff007f" stop-opacity=".8"/>
  <stop offset="1" stop-color="#ff007f" stop-opacity="0"/>
</linearGradient>

<linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
  <stop offset=".8" stop-color="#00f0ff" stop-opacity=".15"/>
  <stop offset="1" stop-color="#00f0ff" stop-opacity=".85"/>
</linearGradient>

<linearGradient id="cyberCardBg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#091224" stop-opacity=".96"/>
  <stop offset="1" stop-color="#050a16" stop-opacity=".98"/>
</linearGradient>

<pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
  <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width=".7" stroke-opacity=".08"/>
</pattern>

<pattern id="hexGrid" width="28" height="48.5" patternUnits="userSpaceOnUse">
  <path d="M14 0L28 8.08V24.25L14 32.33L0 24.25V8.08Z M0 48.5L14 40.42L28 48.5" fill="none" stroke="#00f0ff" stroke-width=".6" stroke-opacity=".06"/>
</pattern>

<filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="3.5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="glowMagenta" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="3.5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="laserBlur" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="5"/>
</filter>
</defs><rect width="1200" height="360" fill="url(#cyberSky)"/><rect width="1200" height="360" fill="url(#cyberGrid)" opacity=".5"/><g stroke="#00f0ff" stroke-width="1" stroke-opacity=".25"><line x1="600" y1="120" x2="0" y2="360"/><line x1="600" y1="120" x2="200" y2="360"/><line x1="600" y1="120" x2="400" y2="360"/><line x1="600" y1="120" x2="520" y2="360"/><line x1="600" y1="120" x2="680" y2="360"/><line x1="600" y1="120" x2="800" y2="360"/><line x1="600" y1="120" x2="1000" y2="360"/><line x1="600" y1="120" x2="1200" y2="360"/></g><g stroke="#ff007f" stroke-width="1" stroke-opacity=".3"><line x1="450" y1="160" x2="750" y2="160"/><line x1="360" y1="200" x2="840" y2="200"/><line x1="240" y1="250" x2="960" y2="250"/><line x1="80" y1="310" x2="1120" y2="310"/></g><circle cx="600" cy="120" r="70" fill="none" stroke="#ff007f" stroke-width="1.8" stroke-dasharray="8 6"/><circle cx="600" cy="120" r="40" fill="none" stroke="#00f0ff" stroke-width="1.4"/><circle cx="600" cy="120" r="6" fill="#fff"/><rect x="250" y="210" width="700" height="96" fill="#060c1c" fill-opacity=".92" stroke="#00f0ff" stroke-width="1.2"/><path d="M 250,230 L 250,210 L 270,210" fill="none" stroke="#00f0ff" stroke-width="3"/><path d="M 950,286 L 950,306 L 930,306" fill="none" stroke="#ff007f" stroke-width="3"/><text x="600" y="246" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="3">// ALL RUNTIMES NOMINAL · ZERO UNCAUGHT EXCEPTIONS //</text><text x="600" y="278" fill="#7898ba" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="2">SYSTEM ARCHITECTED &amp; FORGED BY TANISHQ SHAH  ·  ANNO MMXXVI</text><rect y="0" width="1200" height="2" fill="url(#cyberLaser)"/></svg>